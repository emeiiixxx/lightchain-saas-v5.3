<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100">
<rect x="0" y="0" width="1000" height="1100" fill="#FFFFFF"/>
<text x="40" y="42" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="600" fill="#19344B" text-anchor="start">SaaS v5.3 · 画布浏览与整理</text>
<ellipse cx="500" cy="100" rx="150" ry="27" fill="#EAF7F5" stroke="#238A85" stroke-width="1.6"/>
<text x="500" y="107" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">进入已有内容的画布</text>
<polyline points="500,127 500,160" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="500,160 495,151 505,151" fill="#7D91A1"/>
<polygon points="500,160.0 660.0,216 500,272.0 340.0,216" fill="#FFF8E9" stroke="#BD924B" stroke-width="1.6"/>
<text x="500" y="210" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">当前视窗内</text>
<text x="500" y="236" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">是否有节点？</text>
<polyline points="660,216 732,216" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="732,216 723,211 723,221" fill="#7D91A1"/>
<text x="696" y="197" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#5C7080" text-anchor="middle">无</text>
<rect x="732" y="174" width="240" height="84" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="852.0" y="209.0" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#19344B" text-anchor="middle">点击「回到节点」</text>
<text x="852.0" y="237.0" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#19344B" text-anchor="middle">按全部边界适应视窗</text>
<polyline points="852,258 852,304 500,304" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polyline points="500,272 500,338" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="500,338 495,329 505,329" fill="#7D91A1"/>
<text x="468" y="300" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#5C7080" text-anchor="end">有</text>
<text x="45" y="194" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#5C7080" text-anchor="start">部分可见也视为「有」。</text>
<text x="45" y="222" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#5C7080" text-anchor="start">空画布不显示</text>
<text x="45" y="250" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#5C7080" text-anchor="start">「回到节点」。</text>
<ellipse cx="500" cy="365" rx="116" ry="27" fill="#EAF7F5" stroke="#367DC4" stroke-width="1.6"/>
<text x="500" y="372" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">按需选择操作</text>
<polyline points="384,365 270,365 270,416" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="270,416 265,407 275,407" fill="#7D91A1"/>
<polyline points="616,365 740,365 740,416" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="740,416 735,407 745,407" fill="#7D91A1"/>
<text x="270" y="399" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="600" fill="#367DC4" text-anchor="middle">定位浏览</text>
<text x="740" y="399" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="600" fill="#238A85" text-anchor="middle">整理画布</text>
<rect x="80" y="416" width="380" height="104" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="270.0" y="447.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">小地图定位 / 拖动可视框</text>
<text x="270.0" y="475.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">选择倍率（含 3%、5%）</text>
<text x="270.0" y="503.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">滚轮缩放 / 平移画布</text>
<rect x="560" y="416" width="360" height="64" rx="14" fill="#EDF8F5" stroke="#238A85" stroke-width="1.6"/>
<text x="740.0" y="455.0" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">整理全部图片与编辑节点</text>
<polyline points="740,480 740,524" fill="none" stroke="#238A85" stroke-width="2" stroke-linejoin="round"/>
<polygon points="740,524 735,515 745,515" fill="#238A85"/>
<rect x="560" y="524" width="360" height="76" rx="14" fill="#EDF8F5" stroke="#238A85" stroke-width="1.6"/>
<text x="740.0" y="555.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">按来源分组排版</text>
<text x="740.0" y="583.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">组内顶部对齐、分组换行</text>
<polyline points="740,600 740,644" fill="none" stroke="#238A85" stroke-width="2" stroke-linejoin="round"/>
<polygon points="740,644 735,635 745,635" fill="#238A85"/>
<rect x="560" y="644" width="360" height="64" rx="14" fill="#EDF8F5" stroke="#238A85" stroke-width="1.6"/>
<text x="740.0" y="683.0" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">适应屏幕（3%～100%）</text>
<text x="80" y="575" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#5C7080" text-anchor="start">导航与缩放只改变视图，</text>
<text x="80" y="603" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#5C7080" text-anchor="start">不会改变节点坐标。</text>
<text x="80" y="655" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#5C7080" text-anchor="start">视窗若再次移出全部节点，</text>
<text x="80" y="683" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#5C7080" text-anchor="start">仍可通过「回到节点」找回。</text>
<text x="560" y="746" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#5C7080" text-anchor="start">整理会改变坐标，支持撤销恢复位置。</text>
<polyline points="270,520 270,540 40,540 40,778 500,778" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polyline points="740,708 740,778 500,778" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polyline points="500,778 500,812" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="500,812 495,803 505,803" fill="#7D91A1"/>
<rect x="320" y="812" width="360" height="64" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="500.0" y="851.0" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">选择图片或编辑节点</text>
<polyline points="500,876 500,910" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="500,910 495,901 505,901" fill="#7D91A1"/>
<rect x="320" y="910" width="360" height="64" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="500.0" y="935.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">显示选中框</text>
<text x="500.0" y="963.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">关联连线切换为流动蚂蚁线</text>
<polyline points="500,974 500,1018" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="500,1018 495,1009 505,1009" fill="#7D91A1"/>
<ellipse cx="500" cy="1045" rx="100" ry="27" fill="#EAF7F5" stroke="#238A85" stroke-width="1.6"/>
<text x="500" y="1052" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">继续编辑</text>
</svg>